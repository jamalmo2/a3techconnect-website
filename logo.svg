<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient definitions -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4d03f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8941f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d5aa0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a5f;stop-opacity:1" />
    </linearGradient>
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle for logo icon -->
  <circle cx="30" cy="30" r="25" fill="url(#blueGradient)" opacity="0.1"/>
  
  <!-- AI Neural Network Nodes (left side) -->
  <g id="neural-network">
    <!-- Central node -->
    <circle cx="30" cy="30" r="8" fill="url(#goldGradient)" filter="url(#glow)"/>
    <circle cx="30" cy="30" r="6" fill="#ffffff" opacity="0.3"/>
    
    <!-- Connected nodes forming neural network pattern -->
    <circle cx="15" cy="20" r="4" fill="url(#blueGradient)" opacity="0.8"/>
    <circle cx="15" cy="40" r="4" fill="url(#blueGradient)" opacity="0.8"/>
    <circle cx="45" cy="20" r="4" fill="url(#blueGradient)" opacity="0.8"/>
    <circle cx="45" cy="40" r="4" fill="url(#blueGradient)" opacity="0.8"/>
    <circle cx="30" cy="15" r="3.5" fill="url(#blueGradient)" opacity="0.6"/>
    <circle cx="30" cy="45" r="3.5" fill="url(#blueGradient)" opacity="0.6"/>
    
    <!-- Connection lines (neural pathways) -->
    <line x1="30" y1="30" x2="15" y2="20" stroke="url(#goldGradient)" stroke-width="1.5" opacity="0.6"/>
    <line x1="30" y1="30" x2="15" y2="40" stroke="url(#goldGradient)" stroke-width="1.5" opacity="0.6"/>
    <line x1="30" y1="30" x2="45" y2="20" stroke="url(#goldGradient)" stroke-width="1.5" opacity="0.6"/>
    <line x1="30" y1="30" x2="45" y2="40" stroke="url(#goldGradient)" stroke-width="1.5" opacity="0.6"/>
    <line x1="30" y1="30" x2="30" y2="15" stroke="url(#goldGradient)" stroke-width="1.5" opacity="0.4"/>
    <line x1="30" y1="30" x2="30" y2="45" stroke="url(#goldGradient)" stroke-width="1.5" opacity="0.4"/>
    
    <!-- Inter-node connections -->
    <line x1="15" y1="20" x2="45" y2="20" stroke="url(#blueGradient)" stroke-width="1" opacity="0.3"/>
    <line x1="15" y1="40" x2="45" y2="40" stroke="url(#blueGradient)" stroke-width="1" opacity="0.3"/>
  </g>
  
  <!-- Technology Circuit Pattern (overlay) -->
  <g id="circuit-pattern" opacity="0.4">
    <!-- Circuit lines -->
    <path d="M 20 25 L 25 25 L 25 20" stroke="url(#goldGradient)" stroke-width="1" fill="none"/>
    <path d="M 35 25 L 40 25 L 40 20" stroke="url(#goldGradient)" stroke-width="1" fill="none"/>
    <path d="M 20 35 L 25 35 L 25 40" stroke="url(#goldGradient)" stroke-width="1" fill="none"/>
    <path d="M 35 35 L 40 35 L 40 40" stroke="url(#goldGradient)" stroke-width="1" fill="none"/>
    
    <!-- Small circuit nodes -->
    <circle cx="25" cy="20" r="1.5" fill="url(#goldGradient)"/>
    <circle cx="25" cy="40" r="1.5" fill="url(#goldGradient)"/>
    <circle cx="40" cy="20" r="1.5" fill="url(#goldGradient)"/>
    <circle cx="40" cy="40" r="1.5" fill="url(#goldGradient)"/>
  </g>
  
  <!-- Data Stream Effect -->
  <g id="data-stream" opacity="0.5">
    <path d="M 10 30 Q 20 25, 30 30 T 50 30" stroke="url(#blueGradient)" stroke-width="2" fill="none" stroke-dasharray="3,3">
      <animate attributeName="stroke-dashoffset" values="0;6" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Company Name Text -->
  <g id="company-name">
    <!-- A3 Text with tech styling -->
    <text x="70" y="25" font-family="'Inter', 'Arial', sans-serif" font-size="18" font-weight="700" fill="url(#goldGradient)">
      A3
    </text>
    <text x="70" y="42" font-family="'Inter', 'Arial', sans-serif" font-size="12" font-weight="600" fill="url(#blueGradient)" opacity="0.9">
      Tech Connect
    </text>
    
    <!-- Decorative line under text -->
    <line x1="70" y1="28" x2="190" y2="28" stroke="url(#goldGradient)" stroke-width="1.5" opacity="0.3"/>
  </g>
  
  <!-- Subtle tech grid pattern in background -->
  <g id="tech-grid" opacity="0.05">
    <defs>
      <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse">
        <path d="M 10 0 L 0 0 0 10" fill="none" stroke="url(#blueGradient)" stroke-width="0.5"/>
      </pattern>
    </defs>
    <rect width="200" height="60" fill="url(#grid)"/>
  </g>
</svg>
