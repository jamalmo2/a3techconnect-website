<svg width="300" height="80" viewBox="0 0 300 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients for the 3D cube -->
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5ba3f5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cubeSide1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d5aa0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a5f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cubeSide2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3d6bb0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d5aa0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background (black) -->
  <rect width="300" height="80" fill="#000000"/>
  
  <!-- 3D Isometric Cube -->
  <g id="cube" transform="translate(20, 20)">
    <!-- Top face of cube -->
    <path d="M 20 0 L 40 10 L 20 20 L 0 10 Z" fill="url(#cubeTop)"/>
    
    <!-- Right side face -->
    <path d="M 40 10 L 40 30 L 20 40 L 20 20 Z" fill="url(#cubeSide1)"/>
    
    <!-- Left side face -->
    <path d="M 0 10 L 20 20 L 20 40 L 0 30 Z" fill="url(#cubeSide2)"/>
    
    <!-- Orange-yellow dots at vertices -->
    <circle cx="20" cy="0" r="3" fill="#f4a261"/>
    <circle cx="0" cy="10" r="3" fill="#f4a261"/>
    <circle cx="40" cy="10" r="3" fill="#f4a261"/>
  </g>
  
  <!-- Company Name Text -->
  <g id="company-text" transform="translate(75, 10)">
    <!-- A3 - Large, bold, dark gray -->
    <text x="0" y="25" font-family="'Inter', 'Arial', sans-serif" font-size="32" font-weight="800" fill="#2c2c2c">
      A3
    </text>
    
    <!-- TECH CONNECT - Smaller, lighter gray -->
    <text x="0" y="42" font-family="'Inter', 'Arial', sans-serif" font-size="14" font-weight="600" fill="#4a4a4a" letter-spacing="0.5px">
      TECH CONNECT
    </text>
    
    <!-- AI Tag - Orange-yellow pill shape -->
    <rect x="95" y="28" width="28" height="16" rx="8" fill="#f4a261"/>
    <text x="109" y="40" font-family="'Inter', 'Arial', sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">
      AI
    </text>
    
    <!-- Tagline: ENTERPRISE TRANSFORMATION -->
    <text x="0" y="58" font-family="'Inter', 'Arial', sans-serif" font-size="9" font-weight="500" fill="#6a6a6a" letter-spacing="1px">
      ENTERPRISE TRANSFORMATION
    </text>
  </g>
</svg>
