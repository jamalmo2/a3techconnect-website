<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cubeTopIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5ba3f5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cubeSide1Icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d5aa0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a5f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cubeSide2Icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3d6bb0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d5aa0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background (black) -->
  <rect width="80" height="80" fill="#000000" rx="8"/>
  
  <!-- 3D Isometric Cube -->
  <g id="cube-icon" transform="translate(20, 20)">
    <!-- Top face of cube -->
    <path d="M 20 0 L 40 10 L 20 20 L 0 10 Z" fill="url(#cubeTopIcon)"/>
    
    <!-- Right side face -->
    <path d="M 40 10 L 40 30 L 20 40 L 20 20 Z" fill="url(#cubeSide1Icon)"/>
    
    <!-- Left side face -->
    <path d="M 0 10 L 20 20 L 20 40 L 0 30 Z" fill="url(#cubeSide2Icon)"/>
    
    <!-- Orange-yellow dots at vertices -->
    <circle cx="20" cy="0" r="3" fill="#f4a261"/>
    <circle cx="0" cy="10" r="3" fill="#f4a261"/>
    <circle cx="40" cy="10" r="3" fill="#f4a261"/>
  </g>
  
  <!-- AI Tag -->
  <rect x="50" y="25" width="20" height="12" rx="6" fill="#f4a261"/>
  <text x="60" y="33" font-family="'Inter', 'Arial', sans-serif" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">
    AI
  </text>
</svg>
