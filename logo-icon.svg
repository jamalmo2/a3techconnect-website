<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4d03f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8941f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d5aa0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a5f;stop-opacity:1" />
    </linearGradient>
    <filter id="glowIcon">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <circle cx="30" cy="30" r="28" fill="url(#blueGrad)" opacity="0.1"/>
  
  <!-- Central AI node -->
  <circle cx="30" cy="30" r="10" fill="url(#goldGrad)" filter="url(#glowIcon)"/>
  <circle cx="30" cy="30" r="7" fill="#ffffff" opacity="0.3"/>
  
  <!-- Neural network nodes -->
  <circle cx="15" cy="20" r="5" fill="url(#blueGrad)" opacity="0.8"/>
  <circle cx="15" cy="40" r="5" fill="url(#blueGrad)" opacity="0.8"/>
  <circle cx="45" cy="20" r="5" fill="url(#blueGrad)" opacity="0.8"/>
  <circle cx="45" cy="40" r="5" fill="url(#blueGrad)" opacity="0.8"/>
  <circle cx="30" cy="12" r="4" fill="url(#blueGrad)" opacity="0.6"/>
  <circle cx="30" cy="48" r="4" fill="url(#blueGrad)" opacity="0.6"/>
  
  <!-- Neural connections -->
  <line x1="30" y1="30" x2="15" y2="20" stroke="url(#goldGrad)" stroke-width="2" opacity="0.7"/>
  <line x1="30" y1="30" x2="15" y2="40" stroke="url(#goldGrad)" stroke-width="2" opacity="0.7"/>
  <line x1="30" y1="30" x2="45" y2="20" stroke="url(#goldGrad)" stroke-width="2" opacity="0.7"/>
  <line x1="30" y1="30" x2="45" y2="40" stroke="url(#goldGrad)" stroke-width="2" opacity="0.7"/>
  <line x1="30" y1="30" x2="30" y2="12" stroke="url(#goldGrad)" stroke-width="2" opacity="0.5"/>
  <line x1="30" y1="30" x2="30" y2="48" stroke="url(#goldGrad)" stroke-width="2" opacity="0.5"/>
  
  <!-- Circuit pattern overlay -->
  <path d="M 20 25 L 25 25 L 25 20" stroke="url(#goldGrad)" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M 35 25 L 40 25 L 40 20" stroke="url(#goldGrad)" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M 20 35 L 25 35 L 25 40" stroke="url(#goldGrad)" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M 35 35 L 40 35 L 40 40" stroke="url(#goldGrad)" stroke-width="1.5" fill="none" opacity="0.5"/>
  
  <!-- Data particles -->
  <circle cx="10" cy="30" r="2" fill="url(#goldGrad)" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="30" r="2" fill="url(#goldGrad)" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
</svg>
